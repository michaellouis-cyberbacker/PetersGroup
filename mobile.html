<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PetersGroup Mobile</title>

<style>
  :root {
    --navy: #0d1b2a;
    --white: #ffffff;
  }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: var(--white);
    color: var(--navy);
  }

  .header {
    display: flex;
    flex-direction: column;
    background-color: var(--navy);
    padding: 15px;
    text-align: center;
  }

  .header img {
    width: 200px;
    margin: 0 auto;
  }

  .nav-menu {
    background-color: var(--navy);
    padding: 10px;
  }

  .nav-menu a {
    display: block;
    color: var(--white);
    text-decoration: none;
    padding: 10px;
    font-weight: bold;
  }

  .slideshow-container {
    position: relative;
    width: 100%;
    margin-top: 10px;
    overflow: hidden;
  }

  .mySlides {
    display: none;
    position: relative;
  }

  .mySlides img {
    width: 100%;
    height: 45vh;
    object-fit: cover;
  }

  /* Slide button (mobile) */
  .slide-button {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 12px 26px;
    background-color: rgba(13, 27, 42, 0.85);
    color: white;
    font-weight: bold;
    border-radius: 6px;
    text-decoration: none;
    font-size: 1rem;
    z-index: 999;
  }

  .prev, .next {
    cursor: pointer;
    position: absolute;
    top: 50%;
    width: auto;
    padding: 10px;
    margin-top: -18px;
    color: white;
    font-weight: bold;
    font-size: 22px;
    background-color: rgba(0, 0, 0, 0.4);
    border-radius: 3px;
    user-select: none;
  }

  .prev { left: 8px; }
  .next { right: 8px; }

  .dot-container {
    text-align: center;
    padding: 8px;
    background: var(--navy);
  }

  .dot {
    height: 10px;
    width: 10px;
    margin: 0 4px;
    background-color: #bbb;
    border-radius: 50%;
    display: inline-block;
  }

  .active {
    background-color: var(--navy);
  }
</style>
</head>
<body>

  <div class="header">
    <img src="https://raw.githubusercontent.com/michaellouis-cyberbacker/PetersGroup/refs/heads/main/Logos/Peters%20Group.PNG" alt="Peters Group Logo">
  </div>

  <div class="nav-menu">
    <a href="index.html">Home</a>
    <a href="CalendarMobile.html">House Tours</a>
    <a href="AdamMobile.html">Adam Peters Reviews</a>
    <a href="AshleyMobile.html">Ashley Peters Reviews</a>
    <a href="https://app.rentredi.com/listingDetails/NuczMAXbb3W1sZxAnSCsGehPcXx1" target="_blank">RentRedi Properties</a>
  </div>

  <div class="slideshow-container">
    <div class="mySlides">
      <img src="Images/MC.png" alt="Slide 1">
    </div>

    <div class="mySlides">
      <img src="https://raw.githubusercontent.com/michaellouis-cyberbacker/PetersGroup/refs/heads/main/Homes/2.png" alt="Slide 2">

      <a href="https://app.rentredi.com/listingDetails/NuczMAXbb3W1sZxAnSCsGehPcXx1"
        target="_blank"
        class="slide-button">
        View Properties for Rent
      </a>
    </div>

    <div class="mySlides">
      <img src="https://raw.githubusercontent.com/michaellouis-cyberbacker/PetersGroup/refs/heads/main/Homes/3.png" alt="Slide 3">
    </div>

    <div class="mySlides">
      <img src="https://raw.githubusercontent.com/michaellouis-cyberbacker/PetersGroup/refs/heads/main/Homes/4.png" alt="Slide 4">
    </div>

    <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
    <a class="next" onclick="plusSlides(1)">&#10095;</a>

  </div>

  <div class="dot-container">
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>

  <script>
    let slideIndex = 1;
    showSlides(slideIndex);

    function plusSlides(n) {
      showSlides(slideIndex += n);
    }

    function showSlides(n) {
      let slides = document.getElementsByClassName("mySlides");
      let dots = document.getElementsByClassName("dot");

      if (n > slides.length) { slideIndex = 1; }
      if (n < 1) { slideIndex = slides.length; }

      for (let i = 0; i < slides.length; i++) {
        slides[i].style.display = "none";
      }

      for (let i = 0; i < dots.length; i++) {
        dots[i].className = dots[i].className.replace(" active", "");
      }

      slides[slideIndex - 1].style.display = "block";
      dots[slideIndex - 1].className += " active";
    }

    setInterval(() => plusSlides(1), 5000);
  </script>

</body>
</html>
