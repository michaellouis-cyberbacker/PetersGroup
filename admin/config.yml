collections:
  - name: "listings"
    label: "Listings"
    files:
      - label: "All Listings"
        name: "all_listings"
        file: "data/listings.json"
        fields:
          - label: "Listings"
            name: "listings"
            widget: "list"
            summary: "{{fields.title}} — {{fields.status}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Price", name: "price", widget: "string" }
              - { label: "Location", name: "location", widget: "string" }

              # 🆕 NEW FIELDS
              - { label: "Bedrooms", name: "bedrooms", widget: "number", min: 0, value_type: "int" }
              - { label: "Bathrooms", name: "bathrooms", widget: "number", min: 0, value_type: "float", step: 0.5 }
              - { label: "Lot Size (sq ft)", name: "lot_size", widget: "number", min: 0 }

              # 🆕 UPDATED STATUS OPTIONS
              - label: "Status"
                name: "status"
                widget: "select"
                options:
                  - Available
                  - Coming Soon
                  - Under Contract
                  - Sold

              - { label: "Image", name: "image", widget: "image" }
              - { label: "External URL", name: "external_url", widget: "string", required: false }
