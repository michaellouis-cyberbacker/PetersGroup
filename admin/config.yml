backend:
  name: git-gateway
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "listings"
    label: "Listings"
    files:
      - label: "All Listings"
        name: "all_listings"
        file: "data/listings.json"
        fields:
          - label: "Listings"
            name: "listings"
            widget: "list"
            summary: "{{fields.title}} — {{fields.status}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Price", name: "price", widget: "string" }
              - { label: "Location", name: "location", widget: "string" }
              - label: "Status"
                name: "status"
                widget: "select"
                options: ["Available", "Sold", "Under Contract"]
              - { label: "Image", name: "image", widget: "image" }
              - { label: "External URL", name: "external_url", widget: "string", required: false }

