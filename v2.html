<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ella Valley Homes</title>

  <style>
    :root {
      --gold: #c6a25a;
      --navy: #0d1b2a;
      --navy-dark: #08121f;
      --white: #ffffff;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, var(--navy) 0%, var(--navy-dark) 100%);
      color: var(--white);
    }

    /* LOGO */
    .logo-center {
      text-align: center;
      padding: 30px 20px 10px;
    }

    .logo-center img {
      height: 90px;
    }

    /* SLIDESHOW */
    .slideshow-container {
      position: relative;
      max-width: 100%;
      margin: 20px auto 0;
      overflow: hidden;
    }

    .mySlides {
      display: none;
      position: relative;
    }

    .mySlides img {
      width: 100%;
      height: 80vh;
      object-fit: cover;
    }

    .fade {
      animation: fadeEffect 1.5s;
    }

    @keyframes fadeEffect {
      from { opacity: 0.4; }
      to { opacity: 1; }
    }

    .slide-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 16px 34px;
      background-color: rgba(13, 27, 42, 0.85);
      color: white;
      font-weight: bold;
      border-radius: 8px;
      text-decoration: none;
      border: 2px solid rgba(255,255,255,0.35);
    }

    .prev, .next {
      position: absolute;
      top: 50%;
      padding: 12px;
      color: white;
      font-size: 24px;
      background-color: rgba(0,0,0,0.4);
      cursor: pointer;
      border-radius: 3px;
    }

    .prev { left: 10px; }
    .next { right: 10px; }

    .dot-container {
      text-align: center;
      padding: 15px;
    }

    .dot {
      height: 12px;
      width: 12px;
      margin: 0 5px;
      background-color: #bbb;
      border-radius: 50%;
      display: inline-block;
    }

    .active {
      background-color: var(--gold);
    }

    /* CONTENT */
    .content-section {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      text-align: center;
    }

    .content-section h1 {
      color: var(--gold);
      font-size: 2.4rem;
    }

    .content-section p {
      font-size: 1.1rem;
      line-height: 1.7;
      margin-bottom: 40px;
      color: #e0e0e0;
    }

    /* LISTINGS */
    #listings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
      margin-top: 30px;
    }

    .listing-card {
      border: 1px solid #e5e5e5;
      border-radius: 14px;
      padding: 14px;
      text-align: left;
      display: flex;
      flex-direction: column;
      background: rgba(255,255,255,0.04);
    }

    .listing-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .listing-card h3 {
      margin: 0 0 6px;
      font-size: 1.05rem;
    }

    .listing-card .meta {
      margin: 4px 0;
      font-size: 0.9rem;
      color: #ccc;
    }

    .listing-card .price {
      font-weight: 700;
      margin: 6px 0 10px;
      color: var(--gold);
    }

    .listing-card .btn {
      margin-top: auto;
      display: inline-block;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--gold);
      color: var(--gold);
      text-decoration: none;
      text-align: center;
      font-weight: 600;
    }

    /* PAGINATION */
    .pagination {
      margin-top: 25px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
    }

    .pagination button {
      background: transparent;
      color: var(--gold);
      border: 1px solid var(--gold);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .pagination button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .pagination span {
      color: #ddd;
      font-size: 0.9rem;
    }

    /* JOTFORM */
    .calendar-container {
      background-color: #f7f7f7;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.3);
      margin-top: 50px;
    }

    /* FOOTER */
    .footer {
      background-color: var(--navy-dark);
      text-align: center;
      padding: 15px;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <div class="logo-center">
    <img src="https://raw.githubusercontent.com/michaellouis-cyberbacker/PetersGroup/refs/heads/main/Logos/Peters%20Group.PNG">
  </div>

  <!-- SLIDESHOW -->
  <div class="slideshow-container">
    <div class="mySlides fade">
      <img src="Images/MC.png" alt="Home 1">
    </div>

    <div class="mySlides fade">
      <img src="https://raw.githubusercontent.com/michaellouis-cyberbacker/PetersGroup/refs/heads/main/Homes/2.png" alt="Home 2">
      <a href="https://app.rentredi.com/listingDetails/NuczMAXbb3W1sZxAnSCsGehPcXx1" target="_blank" class="slide-button">
        View Properties for Rent
      </a>
    </div>

    <div class="mySlides fade">
      <img src="https://raw.githubusercontent.com/michaellouis-cyberbacker/PetersGroup/refs/heads/main/Homes/3.png" alt="Home 3">
      <a href="https://www.padsplit.com/listing/14427" target="_blank" class="slide-button">
        Book on PadSplit
      </a>
    </div>

    <div class="mySlides fade">
      <img src="https://raw.githubusercontent.com/michaellouis-cyberbacker/PetersGroup/refs/heads/main/Homes/4.png" alt="Home 4">
    </div>

    <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
    <a class="next" onclick="plusSlides(1)">&#10095;</a>
  </div>

  <div class="dot-container">
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>

  <!-- CONTENT -->
  <section class="content-section">
    <h1><em>Walking You Home</em></h1>

    <p>
      At <b>Ella Valley Homes</b>, we believe a house is more than just four walls and a roof,
      it’s the backdrop to your life’s most meaningful moments.
    </p>

    <section>
      <h2>Available Listings</h2>
      <div id="listings-grid"></div>
      <div id="pagination" class="pagination"></div>
    </section>

    <div class="calendar-container">
      <iframe
        src="https://form.jotform.com/260066429041451"
        style="width:100%; height:540px; border:none;">
      </iframe>
    </div>
  </section>

  <footer class="footer">
    <p>&copy; 2025 Ella Valley Homes LLC. All rights reserved.</p>
  </footer>

  <!-- LISTINGS SCRIPT -->
  <script>
    const PAGE_SIZE = 5;
    let currentPage = 1;
    let listingsData = [];

    function renderListings() {
      const grid = document.getElementById('listings-grid');
      const start = (currentPage - 1) * PAGE_SIZE;
      const end = start + PAGE_SIZE;
      const pageItems = listingsData.slice(start, end);

      grid.innerHTML = pageItems.map(x => `
        <article class="listing-card">
          <img src="${x.image}" alt="${x.title}">
          <h3>${x.title}</h3>
          <p class="meta">${x.location}</p>
          <p class="price">${x.price}</p>
          ${x.external_url ? `<a class="btn" href="${x.external_url}" target="_blank">View Details</a>` : ``}
        </article>
      `).join('') || `<p>No available listings right now.</p>`;

      renderPagination();
    }

    function renderPagination() {
      const pagination = document.getElementById('pagination');
      const totalPages = Math.ceil(listingsData.length / PAGE_SIZE);

      if (totalPages <= 1) {
        pagination.innerHTML = "";
        return;
      }

      pagination.innerHTML = `
        <button ${currentPage === 1 ? "disabled" : ""} onclick="changePage(${currentPage - 1})">Prev</button>
        <span>Page ${currentPage} of ${totalPages}</span>
        <button ${currentPage === totalPages ? "disabled" : ""} onclick="changePage(${currentPage + 1})">Next</button>
      `;
    }

    function changePage(page) {
      currentPage = page;
      renderListings();
    }

    fetch('/data/listings.json')
      .then(r => r.json())
      .then(({ listings }) => {
        listingsData = (listings || []).filter(x => x.status === "Available");
        renderListings();
      })
      .catch(() => {
        document.getElementById('listings-grid').innerHTML =
          `<p>Listings failed to load.</p>`;
      });
  </script>

  <!-- SLIDESHOW SCRIPT -->
  <script>
    let slideIndex = 1;
    showSlides(slideIndex);

    function plusSlides(n) {
      showSlides(slideIndex += n);
    }

    function showSlides(n) {
      const slides = document.getElementsByClassName("mySlides");
      const dots = document.getElementsByClassName("dot");

      if (n > slides.length) slideIndex = 1;
      if (n < 1) slideIndex = slides.length;

      for (let i = 0; i < slides.length; i++) slides[i].style.display = "none";
      for (let i = 0; i < dots.length; i++) dots[i].className = dots[i].className.replace(" active", "");

      slides[slideIndex - 1].style.display = "block";
      dots[slideIndex - 1].className += " active";
    }

    setInterval(() => plusSlides(1), 5000);
  </script>

</body>
</html>
