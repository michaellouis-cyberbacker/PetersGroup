<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Make a Payment | Ella Valley Homes</title>
<script async src="https://js.stripe.com/v3/buy-button.js"></script>
<style>
  :root {
    --navy: #0d1b2a;
    --cream: #f8f6f1;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background: var(--cream);
    color: var(--navy);
    font-family: 'Georgia', 'Times New Roman', serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    background: var(--navy);
    min-height: 160px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px 20px;
  }

  header img {
    max-width: 120px;
    width: 40%;
    height: auto;
    border-radius: 50%;
  }

  /* Fallback text logo shown if no image is provided */
  header .logo-fallback {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--cream);
    font-family: 'Georgia', 'Times New Roman', serif;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .card {
    background: #ffffff;
    border: 1px solid rgba(13, 27, 42, 0.08);
    border-radius: 12px;
    padding: 40px 36px;
    max-width: 440px;
    width: 100%;
    text-align: center;
    box-shadow: 0 8px 30px rgba(13, 27, 42, 0.06);
  }

  .card h1 {
    font-size: 24px;
    margin: 0 0 12px;
    color: var(--navy);
  }

  .card p {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    color: rgba(13, 27, 42, 0.75);
    margin: 0 0 28px;
  }

  .button-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
  }

  .secure-note {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 12.5px;
    color: rgba(13, 27, 42, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 4px;
  }

  .secure-note svg {
    flex-shrink: 0;
  }

  footer {
    text-align: center;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 12px;
    color: rgba(13, 27, 42, 0.5);
  }

  footer a {
    color: rgba(13, 27, 42, 0.6);
  }
</style>
</head>
<body>

  <header>
    <img src="Logos/Main.png" alt="Ella Valley Homes" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block';">
    <div class="logo-fallback" id="logo-fallback" style="display:none;">ELLA VALLEY HOMES</div>
  </header>

  <main>
    <div class="card">
      <h1>Payment</h1>
      <p>Pay your rent securely below. Payments are processed by Stripe and your card details are never stored on our servers.</p>

      <div class="button-wrap">
        <stripe-buy-button
          buy-button-id="buy_btn_1U81ew970F5x1JRyvpvfuM1q"
          publishable-key="pk_live_51U807o970F5x1JRy6nRl5zP2JNaiJzd5PsdfbBeOLqPpKpud7kZGeYYpVgJSZYyCNl8Joxw0BwnwR9X3LBLAOm0X00NVbFf2LC"
        >
        </stripe-buy-button>
      </div>

      <div class="secure-note">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="10" rx="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        Secured by Stripe
      </div>
    </div>
  </main>

  <footer>
    Questions about your payment? Contact us at <a href="mailto:ashley@ellavalleyhomes.com">ashley@ellavalleyhomes.com</a>
  </footer>

</body>
</html>
